<style>
:root{--navy:#1d1a3d;--navy2:#2a2658;--org:#ffb43a;--ok:#8ff0a4;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;background:#2b1f14;font-family:Fredoka,ui-rounded,"Trebuchet MS",system-ui,sans-serif}
@media(prefers-color-scheme:light){body{background:#f6e7c8}}
#stage{container-type:inline-size;position:relative;width:100%;max-width:860px;aspect-ratio:4/3;overflow:hidden;border-radius:18px;border:3px solid var(--navy);background:linear-gradient(#f2763c 0%,#fa9a4a 38%,#fdc66f 66%,#fde3a0 100%);user-select:none}
#glow{position:absolute;left:50%;top:38%;width:70cqw;height:70cqw;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,244,190,.85),rgba(255,244,190,0) 65%)}
.ly{position:absolute;left:0;bottom:0;height:72%;width:140%;transition:transform .9s ease;pointer-events:none}
.ly svg{width:100%;height:100%;display:block}
#L1{transform:translateX(calc(var(--p,0) * -30cqw / 10))}
#L2{transform:translateX(calc(var(--p,0) * -60cqw / 10))}
#L3{transform:translateX(calc(var(--p,0) * -90cqw / 10))}
.bird{position:absolute;font-size:2.6cqw;color:#7a3a1c;animation:fly 9s linear infinite;opacity:.8}
@keyframes fly{from{transform:translateX(-10cqw)}to{transform:translateX(115cqw)}}
.card{background:linear-gradient(var(--navy2),var(--navy));border:.5cqw solid #4b457f;border-radius:2.2cqw;color:#fff;box-shadow:0 .6cqw 0 rgba(0,0,0,.25)}
#hud{position:absolute;top:2cqw;left:2cqw;right:2cqw;display:flex;gap:1.6cqw}
#hud .card{padding:1.1cqw 2cqw;flex:1;min-width:0}
#hud small{display:block;font-size:1.7cqw;font-weight:700;letter-spacing:.1em;color:#ffcf6e}
#hud b{font-size:3.6cqw;line-height:1.1}
#cp{display:flex;gap:.5cqw;margin-top:.6cqw}
#cp i{flex:1;height:1.2cqw;border-radius:.6cqw;background:#4b457f}
#cp i.on{background:var(--org)}
#ring{width:5.4cqw;height:5.4cqw;border-radius:50%;background:conic-gradient(var(--org) calc(var(--t,100) * 1%),#4b457f 0);position:relative;flex:none}
#ring::after{content:"";position:absolute;inset:.9cqw;border-radius:50%;background:var(--navy)}
.tm{display:flex;align-items:center;gap:1.4cqw;flex:.9 !important}
#sp{position:absolute;top:17cqw;left:3cqw;right:3cqw;padding:5cqw 3cqw;text-align:center}
#sen{font-size:4cqw;font-weight:600;line-height:1.4;white-space:pre-wrap;word-break:break-word}
#sen .d{color:var(--ok)}#sen .t{color:#cfcbf5;opacity:.8}
#sen .c{color:#fff;border-bottom:.6cqw solid var(--org)}
#sp.shake{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-1cqw)}75%{transform:translateX(1cqw)}}
#lab{position:absolute;top:-2.4cqw;left:50%;transform:translateX(-50%);background:var(--org);color:#3b2308;font-weight:700;font-size:2cqw;padding:.4cqw 2.4cqw;border-radius:2cqw;white-space:nowrap}
.actor{position:absolute;bottom:12%;transform:translateX(-50%)}
#ex{width:11cqw;left:10%;transition:left .12s linear}
#ex.walk svg{animation:bob .3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1cqw) rotate(2deg)}}
#an{left:76%;font-size:13cqw;line-height:1;transition:transform .3s}
#an::after{content:"";position:absolute;left:50%;bottom:-.8cqw;width:80%;height:2cqw;transform:translateX(-50%);background:rgba(90,40,10,.3);border-radius:50%;z-index:-1}
#an.cheer{animation:cheer .7s}
@keyframes cheer{30%{transform:translateX(-50%) translateY(-5cqw) scale(1.15)}}
#an.in{animation:slide .5s ease-out}
@keyframes slide{from{transform:translateX(30cqw)}}
#pop{position:absolute;left:76%;bottom:30%;font-weight:700;font-size:4cqw;color:#fff;text-shadow:0 .4cqw 0 #b24a10;opacity:0}
#pop.go{animation:pop .9s ease-out}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-8cqw)}}
#nx{position:absolute;bottom:2.5cqw;left:50%;transform:translateX(-50%);padding:1.2cqw 4cqw;font-size:2cqw;font-weight:700;letter-spacing:.08em;border-radius:3cqw;background:#5a4630;border:.4cqw solid #3d2e1e;color:#fff;white-space:nowrap}
#nx b{color:var(--org)}
#ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3cqw;background:rgba(29,26,61,.92);color:#fff}
#ov h2{margin:1.4cqw 0;font-size:5.4cqw}
#ov p{margin:.6cqw 0;max-width:60cqw;font-size:2.3cqw;line-height:1.4}
.logo{background:#fff;padding:1.2cqw 2.2cqw;border-radius:2cqw;display:inline-block}
.logo img{display:block;height:6.5cqw;width:auto}
.site{color:var(--org);font-weight:700;font-size:2.3cqw;text-decoration:none;margin:.8cqw 0}
.site:hover{text-decoration:underline}
button{margin-top:2cqw;padding:1.4cqw 5cqw;font:700 3cqw Fredoka,system-ui,sans-serif;color:#3b2308;background:var(--org);border:0;border-bottom:.8cqw solid #c47d0a;border-radius:2.4cqw;cursor:pointer}
button:active{transform:translateY(.4cqw);border-bottom-width:.4cqw}
.st{display:flex;gap:1.4cqw;flex-wrap:wrap;justify-content:center;margin:1.6cqw 0}
.st div{background:var(--navy2);border:.4cqw solid #4b457f;padding:1cqw 2.4cqw;border-radius:2cqw;font-weight:700;font-size:2.6cqw}
small{opacity:.7;font-size:1.9cqw;margin-top:1.4cqw}
</style>
</head>

  $('ov').style.display='flex';
  $('ov').innerHTML=`<a class="logo" href="${SITE}" target="_blank" rel="noopener" title="Visit Typing Games Free"><img src="${LOGO}" alt="Typing Games Free"></a>
  <a class="site" href="${SITE}" target="_blank" rel="noopener">typinggamesfree.io</a>
  <h2>🦁 Safari Sentences</h2>
  <p>Type each sentence <b>exactly</b>, with capitals, punctuation and spaces, to trek on to the next animal.</p>
  <p>Ten sentences. Ninety seconds. A wrong key never counts!</p>
  <button id="go">Start Trek</button><small>Press Enter or Space · Best score: ${best}</small>`;
  $('go').onclick=start;
}
function start(){
  q=POOL.slice().sort(()=>Math.random()-.5).slice(0,10);
  i=0;pos=0;mist=0;good=0;score=0;run=true;t0=performance.now();
  $('ov').style.display='none';clearInterval(timer);timer=setInterval(tick,100);newAnimal(false);render();
}
function tick(){
  const left=T-(performance.now()-t0)/1000,s=Math.max(0,Math.ceil(left));
  $('tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('ring').style.setProperty('--t',Math.max(0,left/T*100));
  if(left<=0)finish(false);
}
function newAnimal(anim){
  const a=$('an');a.textContent=ANIMALS[Math.min(i,9)][0];a.classList.remove('cheer','in');void a.offsetWidth;if(anim)a.classList.add('in');
}
function render(){
  const s=q[i],c=s[pos];
  $('sen').innerHTML=[...s].map((ch,k)=>`<span class="${k<pos?'d':k==pos?'c':'t'}">${ch}</span>`).join('');
  $('lab').textContent=`CHECKPOINT ${i+1} · ${ANIMALS[i][1].toUpperCase()}`;
  $('n').textContent=i;$('sc').textContent=score;
  const tot=good+mist;$('ac2').textContent=(tot?Math.round(good/tot*100):100)+'%';
  [...$('cp').children].forEach((e,k)=>e.classList.toggle('on',k<i));
  $('ex').style.left=(10+pos/s.length*40)+'%';
  document.getElementById('stage').style.setProperty('--p',i);
  $('nx').innerHTML=`NEXT: <b>${c===' '?'SPACE':c}</b> · TYPE TO TREK`;
}
function finish(won){
  run=false;clearInterval(timer);
  const sec=Math.min(T,(performance.now()-t0)/1000),total=good+mist;
  const wpm=Math.round((good/5)/(sec/60)),acc=total?Math.round(good/total*100):0;
  const sc=Math.max(0,score+(won?Math.round(T-sec)*5:0)),nb=sc>best;
  if(nb){best=sc;try{localStorage.setItem('ss_best',best)}catch(e){}}
  $('ov').style.display='flex';
  $('ov').innerHTML=`<h2>${won?'🎉 Safari complete!':'⏰ Time is up!'}</h2>
  <p>${won?'You reached all ten animals.':`You reached checkpoint ${i} of 10.`}${nb?' New best score!':''}</p>
  <div class="st"><div>Score ${sc}</div><div>WPM ${wpm}</div><div>Accuracy ${acc}%</div><div>Mistakes ${mist}</div></div>
  <button id="go">Play again</button>
  <a class="site" href="${SITE}" target="_blank" rel="noopener">More free typing games at typinggamesfree.io →</a>
  <small>Press Enter or Space to play again</small>`;
  $('go').onclick=start;
}
addEventListener('keydown',e=>{
  if(!run){if((e.key==='Enter'||e.key===' ')&&e.target.tagName!=='A'){e.preventDefault();start()}return}
  if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1)return;
  e.preventDefault();
  const s=q[i];
  if(e.key===s[pos]){
    good++;pos++;score+=10;
    $('ex').classList.add('walk');clearTimeout(wt);wt=setTimeout(()=>$('ex').classList.remove('walk'),250);
    if(pos===s.length){
      const p=$('pop');p.textContent='+'+(s.length*2);p.classList.remove('go');void p.offsetWidth;p.classList.add('go');
      $('an').classList.add('cheer');score+=s.length*2;
      i++;pos=0;
      if(i===10){$("sc").textContent=score;return finish(true)}
      setTimeout(()=>newAnimal(true),550);
    }
    render();
  }else{
    mist++;const b=$('sp');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');render();
  }
});
intro();
</script>
</body>
</html>
